name: pharma_connect
description: PharmaConnect — Infrastructure numérique du circuit pharmaceutique et des soins à domicile en Afrique de l'Ouest.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # CARTE & GÉOLOCALISATION
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # NOTIFICATIONS
  flutter_local_notifications: ^16.0.0
  timezone: ^0.9.4

  # SIGNATURE & PHOTOS
  signature: ^5.4.0
  image_picker: ^1.0.0

  # UI & DESIGN
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0

  # ÉTAT & ARCHITECTURE
  provider: ^6.1.0
  equatable: ^2.0.5

  # ROUTING
  go_router: ^13.0.0

  # STOCKAGE LOCAL
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.0

  # RÉSEAU
  dio: ^5.3.0
  connectivity_plus: ^5.0.0

  # SUPABASE
  supabase_flutter: ^2.0.0
  uuid: ^4.4.0

  # SCAN & CAMÉRA (QR Code réservations + OCR)
  mobile_scanner: ^3.5.0
  qr_flutter: ^4.1.0
  google_mlkit_text_recognition: ^0.13.0

  # IMAGES & PARTAGE
  cached_network_image: ^3.3.0
  share_plus: ^7.0.0

  # DONNÉES
  csv: ^5.1.0
  path_provider: ^2.1.0

  # GRAPHIQUES
  fl_chart: ^0.69.0

  lottie: ^3.1.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # ==================== POLICES DE CARACTÈRES ====================
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        # NOTE: seul le poids Light est présent sur disque pour l'instant ;
        # remplacez par JetBrainsMono-Regular.ttf si vous l'ajoutez plus tard.
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Light.ttf
          weight: 400

  # ==================== ASSETS ====================
  assets:
    - assets/icons/
    - assets/images/
    - assets/config/
