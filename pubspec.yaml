name: pharma_connect
description: PharmaConnect — Infrastructure numérique du circuit pharmaceutique et des soins à domicile en Afrique de l'Ouest.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # CARTE & GÉOLOCALISATION
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3

  # NOTIFICATIONS
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # SIGNATURE & PHOTOS
  signature: ^6.4.0
  image_picker: ^1.0.0

  # UI & DESIGN
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.0

  # ÉTAT & ARCHITECTURE
  provider: ^6.1.0
  equatable: ^2.0.5

  # ROUTING
  go_router: ^18.0.0

  # STOCKAGE LOCAL
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.0

  # RÉSEAU
  dio: ^5.3.0
  connectivity_plus: ^7.3.1

  # SUPABASE
  supabase_flutter: ^2.0.0
  uuid: ^4.4.0

  # SCAN & CAMÉRA (QR Code réservations + OCR)
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  google_mlkit_text_recognition: ^0.17.1

  # IMAGES & PARTAGE
  cached_network_image: ^3.3.0
  share_plus: ^13.3.0

  # DONNÉES
  csv: ^8.0.0
  path_provider: ^2.1.0

  # GRAPHIQUES
  fl_chart: ^1.2.0

  lottie: ^3.1.0
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  pdf: ^3.13.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # ==================== POLICES DE CARACTÈRES ====================
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        # NOTE: seul le poids Light est présent sur disque pour l'instant ;
        # remplacez par JetBrainsMono-Regular.ttf si vous l'ajoutez plus tard.
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Light.ttf
          weight: 400

  # ==================== ASSETS ====================
  assets:
    - assets/icons/
    - assets/images/
    - assets/config/
